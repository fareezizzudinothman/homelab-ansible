name: Ansible CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Ansible Controller
    runs-on: ubuntu-latest

    environment: homelab-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible Core
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Configure Ansible Inventory
        run: |
          cat > inventory-ci.ini <<'EOF'
          [ansible]
          ansible-controller ansible_host=100.94.21.73

          [all:vars]
          ansible_user=fareezio
          ansible_python_interpreter=/usr/bin/python3
          ansible_ssh_private_key_file=~/.ssh/id_ed25519
          EOF

      - name: Verify SSH Connection
        run: |
          ssh-keyscan -H 100.94.21.73 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 \
            fareezio@100.94.21.73 \
            "hostname"

      - name: Deploy Ansible Playbook
        run: |
          ansible-playbook \
            -i inventory-ci.ini \
            playbooks/playbook-ansible.yaml
