name: Ansible CD

on:
  workflow_run:
    workflows:
      - Ansible CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Ansible Controller
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment: homelab-production

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Verify SSH Connection
        run: |
          ssh-keyscan -H 100.101.241.93 >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            fareezio@100.101.241.93 \
            "hostname"

      - name: Deploy Ansible Automation
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            fareezio@100.101.241.93 \
            'bash -se' <<'REMOTE'

          set -euo pipefail

          REPO_URL="https://github.com/fareezizzudinothman/homelab-ansible.git"
          REPO_PATH="/opt/homelab-ansible"

          # Prepare repository directory
          sudo install -d -o fareezio -g fareezio "$REPO_PATH"

          # Clone repository if not exists
          if [ ! -d "$REPO_PATH/.git" ]; then

              if [ -n "$(find "$REPO_PATH" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                  echo "ERROR: Repository directory is not empty."
                  exit 1
              fi

              echo "Cloning Ansible repository..."
              git clone "$REPO_URL" "$REPO_PATH"

          else

              echo "Pulling latest Ansible repository..."
              git -C "$REPO_PATH" pull --ff-only origin main

          fi

          # Install Ansible Core if not installed
          echo "Checking Ansible installation..."

          if ! command -v ansible-playbook >/dev/null 2>&1; then
              echo "Installing Ansible Core..."

              sudo apt-get update
              sudo apt-get install -y ansible-core
          fi

          ansible-playbook --version

          # Execute Ansible playbook
          echo "Starting Ansible deployment..."

          cd "$REPO_PATH"

          ansible-playbook \
              -i localhost, \
              -c local \
              playbooks/playbook-ansible.yaml

          echo "Deployment completed successfully."
          REMOTE
