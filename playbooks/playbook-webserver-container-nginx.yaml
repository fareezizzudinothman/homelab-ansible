    #         owner: root
    #         group: root
    #         mode: "0644"
    #         content: |
    #           server {
    #               listen 80;
    #               server_name brain.fareezizzudinothman.com;
    #
    #               location / {
    #                   proxy_pass http://brain:3000;
    #                   proxy_set_header Host $host;
    #                   proxy_set_header X-Real-IP $remote_addr;
    #                   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #                   proxy_set_header X-Forwarded-Proto $scheme;
    #               }
    #           }
    #       notify: Reload Nginx

    # ==================================================
    # APPLICATION: MONITORING (FUTURE)
    # ==================================================

    # - name: APPLICATION - MONITORING
    #   block:
    #
    #     - name: Deploy Monitoring virtual host
    #       ansible.builtin.copy:
    #         dest: "{{ nginx_conf_dir }}/monitoring.conf"
    #         owner: root
    #         group: root
    #         mode: "0644"
    #         content: |
    #           server {
    #               listen 80;
    #               server_name monitoring.fareezizzudinothman.com;
    #
    #               location / {
    #                   proxy_pass http://monitoring:3000;
    #                   proxy_set_header Host $host;
    #                   proxy_set_header X-Real-IP $remote_addr;
    #                   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #                   proxy_set_header X-Forwarded-Proto $scheme;
    #               }
    #           }
    #       notify: Reload Nginx

    # ==================================================
    # APPLY CONFIGURATION CHANGES
    # ==================================================

    - name: Apply pending Nginx configuration changes
      ansible.builtin.meta: flush_handlers

    # ==================================================
    # VALIDATION
    # ==================================================

    - name: VALIDATE CENTRAL NGINX
      block:

        - name: Test Nginx configuration syntax
          ansible.builtin.command:
            cmd: docker exec {{ nginx_container_name }} nginx -t
          changed_when: false

    # ==================================================
    # VALIDATION: BELANJA
    # ==================================================

    - name: VALIDATE APPLICATION - BELANJA
      block:

        - name: Test Belanja frontend HTTP response
          ansible.builtin.uri:
            url: "http://{{ nginx_host_ip }}:{{ nginx_host_port }}/index.html"
            method: GET
            headers:
              Host: "{{ belanja_domain }}"
            status_code: 200
            return_content: false
          register: belanja_http_test
          retries: 10
          delay: 5
          until: belanja_http_test.status == 200

        - name: Test Belanja backend API through Nginx
          ansible.builtin.uri:
            url: "http://{{ nginx_host_ip }}:{{ nginx_host_port }}/api/health"
            method: GET
            headers:
              Host: "{{ belanja_domain }}"
            status_code: 200
            return_content: false
          register: belanja_api_test
          retries: 10
          delay: 5
          until: belanja_api_test.status == 200

    # ==================================================
    # DEPLOYMENT SUMMARY
    # ==================================================

    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "Central Nginx deployment successful."
          - "Container: {{ nginx_container_name }}"
          - "Image: {{ nginx_image }}"
          - "Docker network: {{ nginx_network }}"
          - "Host: {{ nginx_host_ip }}:{{ nginx_host_port }}"
          - "Belanja domain: {{ belanja_domain }}"
          - "Belanja frontend: HTTP 200"
          - "Belanja backend API: HTTP 200"
          - "Future applications: ready for integration"

  handlers:

    # ==================================================
    # NGINX HANDLERS
    # ==================================================

    - name: Reload Nginx
      ansible.builtin.command:
        cmd: docker exec {{ nginx_container_name }} nginx -s reload
      changed_when: true