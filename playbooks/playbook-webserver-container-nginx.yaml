---
- name: Deploy Nginx Reverse Proxy Container
  hosts: webserver
  become: true
  gather_facts: true

  vars:
    nginx_container_name: nginx-proxy
    nginx_image: nginx:1.27-alpine
    nginx_host_port: 2001
    nginx_container_port: 80
    docker_network: homelab-network
    nginx_base_dir: /opt/webstack/infrastructure/nginx

  tasks:

    - name: Create Nginx configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ nginx_base_dir }}"
        - "{{ nginx_base_dir }}/conf.d"

    - name: Check existing Docker network
      community.docker.docker_network_info:
        name: "{{ docker_network }}"
      register: nginx_network_info

    - name: Fail if Docker network does not exist
      ansible.builtin.fail:
        msg: "Docker network {{ docker_network }} does not exist."
      when: not nginx_network_info.exists

    - name: Deploy Nginx main configuration
      ansible.builtin.copy:
        dest: "{{ nginx_base_dir }}/nginx.conf"
        owner: root
        group: root
        mode: "0644"
        content: |
          user nginx;
          worker_processes auto;

          events {
              worker_connections 1024;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              server_tokens off;
              sendfile on;

              access_log /var/log/nginx/access.log;
              error_log /var/log/nginx/error.log;

              include /etc/nginx/conf.d/*.conf;
          }
      notify: Restart Nginx

    - name: Deploy default Nginx virtual host
      ansible.builtin.copy:
        dest: "{{ nginx_base_dir }}/conf.d/default.conf"
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              server_name _;

              location / {
                  default_type text/plain;
                  return 200 "Homelab Nginx Reverse Proxy Ready\n";
              }
          }
      notify: Restart Nginx

    - name: Deploy Nginx container
      community.docker.docker_container:
        name: "{{ nginx_container_name }}"
        image: "{{ nginx_image }}"
        pull: false
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "192.168.0.35:{{ nginx_host_port }}:{{ nginx_container_port }}"
        networks:
          - name: "{{ docker_network }}"
        volumes:
          - "{{ nginx_base_dir }}/nginx.conf:/etc/nginx/nginx.conf:ro"
          - "{{ nginx_base_dir }}/conf.d:/etc/nginx/conf.d:ro"
        cap_drop:
          - ALL
        capabilities:
          - NET_BIND_SERVICE
          - CHOWN
        security_opts:
          - no-new-privileges:true
        memory: 256M
        comparisons:
          image: strict
          networks: strict
          published_ports: strict
          volumes: strict

    - name: Apply pending Nginx handlers
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Restart Nginx
      community.docker.docker_container:
        name: "{{ nginx_container_name }}"
        state: started
        restart: true