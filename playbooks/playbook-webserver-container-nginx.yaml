- name: Deploy and Manage Central Nginx Reverse Proxy
  hosts: webserver
  become: true
  gather_facts: true

  vars:
    # ==================================================
    # CENTRAL NGINX SETTINGS
    # ==================================================

    nginx_container_name: nginx-proxy
    nginx_image: nginx:1.27-alpine

    nginx_host_ip: 192.168.0.35
    nginx_host_port: 2001
    nginx_container_port: 80

    nginx_network: homelab-network

    nginx_base_dir: /opt/webstack/infrastructure/nginx
    nginx_conf_dir: /opt/webstack/infrastructure/nginx/conf.d
    nginx_apps_dir: /opt/webstack/apps

    # ==================================================
    # APPLICATION: BELANJA
    # ==================================================

    belanja_frontend_dir: /opt/webstack/apps/belanja/frontend
    belanja_backend: belanja:4000
    belanja_domain: belanja.fareezizzudinothman.com

  tasks:

    # ==================================================
    # CENTRAL NGINX
    # ==================================================

    - name: CENTRAL NGINX
      block:

        - name: Create Nginx directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          loop:
            - "{{ nginx_base_dir }}"
            - "{{ nginx_conf_dir }}"

        - name: Verify shared Docker network
          community.docker.docker_network_info:
            name: "{{ nginx_network }}"
          register: nginx_network_info

        - name: Validate Docker network
          ansible.builtin.assert:
            that:
              - nginx_network_info.exists
            fail_msg: "Docker network {{ nginx_network }} does not exist."

        - name: Deploy Nginx main configuration
          ansible.builtin.copy:
            dest: "{{ nginx_base_dir }}/nginx.conf"
            owner: root
            group: root
            mode: "0644"
            content: |
              user nginx;
              worker_processes auto;

              events {
                  worker_connections 1024;
              }

              http {
                  include /etc/nginx/mime.types;
                  default_type application/octet-stream;

                  server_tokens off;
                  sendfile on;

                  access_log /var/log/nginx/access.log;
                  error_log /var/log/nginx/error.log;

                  include /etc/nginx/conf.d/*.conf;
              }
          notify: Reload Nginx

        - name: Deploy default Nginx virtual host
          ansible.builtin.copy:
            dest: "{{ nginx_conf_dir }}/default.conf"
            owner: root
            group: root
            mode: "0644"
            content: |
              server {
                  listen 80 default_server;
                  server_name _;

                  default_type text/plain;

                  return 404 "Application not configured\n";
              }
          notify: Reload Nginx

        - name: Deploy Central Nginx container
          community.docker.docker_container:
            name: "{{ nginx_container_name }}"
            image: "{{ nginx_image }}"
            pull: false
            state: started
            restart_policy: unless-stopped

            published_ports:
              - "{{ nginx_host_ip }}:{{ nginx_host_port }}:{{ nginx_container_port }}"

            networks:
              - name: "{{ nginx_network }}"

            volumes:
              - "{{ nginx_base_dir }}/nginx.conf:/etc/nginx/nginx.conf:ro"
              - "{{ nginx_conf_dir }}:/etc/nginx/conf.d:ro"
              - "{{ nginx_apps_dir }}:/usr/share/nginx/apps:ro"

            security_opts:
              - no-new-privileges:true

            memory: 256M

            comparisons:
              image: strict
              networks: strict
              published_ports: strict
              volumes: strict
              restart_policy: strict

          register: nginx_container

    # ==================================================
    # APPLICATION: BELANJA
    # ==================================================

    - name: APPLICATION - BELANJA
      block:

        - name: Verify Belanja frontend directory
          ansible.builtin.stat:
            path: "{{ belanja_frontend_dir }}"
          register: belanja_frontend

        - name: Validate Belanja frontend directory
          ansible.builtin.assert:
            that:
              - belanja_frontend.stat.exists
              - belanja_frontend.stat.isdir
            fail_msg: "Belanja frontend directory does not exist."

        - name: Deploy Belanja virtual host
          ansible.builtin.copy:
            dest: "{{ nginx_conf_dir }}/belanja.conf"
            owner: root
            group: root
            mode: "0644"
            content: |
              server {
                  listen 80;
                  server_name {{ belanja_domain }};

                  root /usr/share/nginx/apps/belanja/frontend;
                  index index.html;

                  # Frontend
                  location / {
                      try_files $uri $uri/ =404;
                  }

                  # Backend API
                  location /api/ {
                      proxy_pass http://{{ belanja_backend }};

                      proxy_http_version 1.1;

                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;

                      proxy_connect_timeout 30s;
                      proxy_send_timeout 60s;
                      proxy_read_timeout 60s;
                  }
              }
          notify: Reload Nginx

    # ==================================================
    # APPLICATION: BRAIN (FUTURE)
    # ==================================================

    # - name: APPLICATION - BRAIN
    #   block:
    #
    #     - name: Deploy Brain virtual host
    #       ansible.builtin.copy:
