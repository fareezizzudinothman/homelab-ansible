---
- name: Deploy Ansible Automation
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars:
    repo_url: https://github.com/fareezizzudinothman/homelab-ansible.git
    repo_path: /opt/homelab-ansible
    main_playbook: playbooks/playbook-ansible.yaml

  tasks:

    - name: Create deployment directory
      ansible.builtin.file:
        path: "{{ repo_path }}"
        state: directory
        owner: fareezio
        group: fareezio
        mode: "0755"

    - name: Clone or update repository
      become: false
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_path }}"
        version: main
        update: true

    - name: Execute main Ansible playbook
      become: false
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - -i
          - localhost,
          - -c
          - local
          - "{{ main_playbook }}"
        chdir: "{{ repo_path }}"
      register: deployment_result
      changed_when: true

    - name: Display deployment result
      ansible.builtin.debug:
        var: deployment_result.stdout_lines